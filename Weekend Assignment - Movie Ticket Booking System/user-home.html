    <style>
        .profile-dropdown {
            position: relative;
            display: inline-block;
        }
        .profile-btn {
            background-color: transparent;
            border: 2px solid #333;
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .profile-btn:hover {
            background-color: #f0f0f0;
        }
        .dropdown-content {
            display: none; 
            position: absolute;
            right: 0; 
            margin-top: 10px;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            border-radius: 5px;
            z-index: 100;
            overflow: hidden;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 16px;
            text-align: left;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
        .dropdown-content hr {
            margin: 0;
            border: 0;
            border-top: 1px solid #ccc;
        }
        .show {
            display: block;
        }
        #Moviesavailable {
            display: flex;
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 40px; 
            padding: 40px;
        }
        .movies {
            display: flex;
            flex-direction: column;
            width: 300px; 
            background-color: white; 
        }
        .movies img {
            width: 100%; 
            height: 450px; 
            object-fit: cover; 
        }
        .book-btn {
            width: 100%; 
            padding: 12px 0;
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            border-top: none; 
            color: black;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }
        .book-btn:hover {
            background-color: #ddd;
        }
        .search-container {
            flex-grow: 1; 
            display: flex;
            justify-content: center; 
            max-width: 500px; 
            margin: 0 20px; 
        }
        .search-container input {
            width: 100%;
            padding: 8px 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            outline: none;
            border-radius: 5px 0 0 5px; 
        }
        .search-container button {
            padding: 8px 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-left: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            border-radius: 0 5px 5px 0; 
        }
        #genre-filter {
            padding: 8px 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-left: 15px;
            outline: none;
            cursor: pointer;
        }
    </style>
</head>

    <script>
        // Wrapped in an Immediately Invoked Function Expression (IIFE) to safely use return
        (function checkLogin() {
            if (!sessionStorage.getItem('loggedInUser')) {
                alert("Access Denied. Please log in first.");
                window.location.href = "login.html";
                return;
            }
        })();

        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault(); 
            sessionStorage.removeItem('loggedInUser'); 
            window.location.href = "login.html"; 
        });

        const profileBtn = document.getElementById('profile-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');
        
        profileBtn.addEventListener('click', function(event) {
            dropdownMenu.classList.toggle('show');
            event.stopPropagation();
        });

        window.addEventListener('click', function() {
            if (dropdownMenu.classList.contains('show')) {
                dropdownMenu.classList.remove('show');
            }
        });

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const movieCards = document.querySelectorAll('.movies');
        const noResultsMsg = document.getElementById('no-results-msg');
        const genreFilter = document.getElementById('genre-filter'); 
        
        function filterMovies() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const selectedGenre = genreFilter.value; 
            let moviesFound = 0;   
            
            movieCards.forEach(card => {
                const title = card.querySelector('img').getAttribute('alt').toLowerCase();
                const cardGenre = card.getAttribute('data-genre');
                const textMatch = title.includes(searchTerm);
                const genreMatch = (selectedGenre === 'all' || cardGenre.includes(selectedGenre));
                
                if (textMatch && genreMatch) {
                    card.style.display = 'flex'; 
                    moviesFound++; 
                } else {
                    card.style.display = 'none'; 
                }
            });
            
            if (moviesFound > 0) {
                noResultsMsg.style.display = 'none'; 
            } else {
                noResultsMsg.style.display = 'block'; 
            }
        }
        
        searchBtn.addEventListener('click', filterMovies);
        genreFilter.addEventListener('change', filterMovies);
        searchInput.addEventListener('input', filterMovies);
        
        const bookNowButtons = document.querySelectorAll('.book-btn');
        bookNowButtons.forEach(button => {
            button.addEventListener('click', function() {
                    const movieCard = this.parentElement; 
                    const movieTitle = movieCard.querySelector('img').getAttribute('alt');
                    localStorage.setItem('selectedMovie', movieTitle);
                    window.location.href = 'booking.html';
            });
        });
    </script>
