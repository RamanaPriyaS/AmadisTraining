<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovizBook - Seat Selection</title>
    <link rel="icon" href="Images/MovizBook.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f9f9f9;
        }
        #seat-booking-container {
            display: flex;
            flex-direction: column;
            align-items: center; 
            width: 100%;
            max-width: 800px;
            margin: 40px auto; 
            padding: 30px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }
        .show-info {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            width: 100%;
        }
        .show-info h2 { color: #333; margin-bottom: 5px; }
        .show-info p { color: #666; font-size: 16px; }
        .screen {
            background-color: #ccc;
            height: 70px;
            width: 100%;
            max-width: 400px;
            margin: 15px 0 40px;
            box-shadow: 0 3px 10px rgba(255, 255, 255, 0.7);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-weight: bold;
            letter-spacing: 5px;
        }
        .seat-map {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .seat-row {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .seat {
            background-color: #d8d8d8;
            height: 35px;
            width: 40px;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .seat:hover:not(.occupied) {
            transform: scale(1.1);
            background-color: #a6a6a6;
        }
        .seat.selected {
            background-color: #6feaf6;
            color: #000;
        }
        .seat.occupied {
            background-color: #444;
            color: #fff;
            cursor: not-allowed;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .legend-box {
            height: 20px;
            width: 25px;
            border-radius: 3px 3px 0 0;
        }
        .box-available { background-color: #d8d8d8; }
        .box-selected { background-color: #6feaf6; }
        .box-occupied { background-color: #444; }
        .checkout-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f2f2f2;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .checkout-details p {
            margin: 5px 0;
            font-size: 16px;
        }
        #confirm-btn {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #confirm-btn:hover { background-color: #555; }
        #confirm-btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
       <nav>
            <div class="logo">
                <img src="Images/MovizBook.png" width="100px" alt="MovizBook Logo"> 
                <span>MovizBook</span>
            </div>
            <div class="nav-link">
                <a href="booking.html">Change Date/Time</a>
            </div>
        </nav>
    </header>

    <main>
        <div id="seat-booking-container">
            <div class="show-info">
                <h2 id="display-title">Loading...</h2>
                <p id="display-datetime">Loading...</p>
            </div>
            <div class="legend">
                <div class="legend-item"><div class="legend-box box-available"></div> Available</div>
                <div class="legend-item"><div class="legend-box box-selected"></div> Selected</div>
                <div class="legend-item"><div class="legend-box box-occupied"></div> Occupied</div>
            </div>
            <div class="screen">SCREEN</div>
            <div class="seat-map" id="seat-map"></div>
            <div class="checkout-bar">
                <div class="checkout-details">
                    <p><strong>Seats:</strong> <span id="selected-seats-list">None</span></p>
                    <p><strong>Total Price:</strong> ₹<span id="total-price">0</span></p>
                </div>
                <button id="confirm-btn" disabled>Confirm Booking</button>
            </div>
        </div>
    </main>

    <script>
        (function initBooking() {
            const currentUser = sessionStorage.getItem('loggedInUser');
            
            if (!currentUser) {
                alert("Please log in to book seats.");
                window.location.href = "login.html";
                return;
            }
            
            const movie = localStorage.getItem('selectedMovie');
            const date = localStorage.getItem('selectedDate');
            const time = localStorage.getItem('selectedTime');
            const ticketPrice = 150;
            
            if (!movie || !date || !time) {
                alert("Incomplete booking information.");
                window.location.href = "user-home.html";
                return;
            }
            
            document.getElementById('display-title').textContent = movie;
            document.getElementById('display-datetime').textContent = `${date} | ${time}`;
            
            const showKey = `occupied_${movie}_${date}_${time}`;
            const occupiedSeats = JSON.parse(localStorage.getItem(showKey)) || [];
            const seatMap = document.getElementById('seat-map');
            const rows = ['A', 'B', 'C', 'D', 'E'];
            const seatsPerRow = 8;
            
            rows.forEach(rowLetter => {
                const rowDiv = document.createElement('div');
                rowDiv.classList.add('seat-row');

                for (let i = 1; i <= seatsPerRow; i++) {
                    const seatID = `${rowLetter}${i}`;
                    const seat = document.createElement('div');
                    seat.classList.add('seat');
                    seat.textContent = seatID;
                    
                    if (occupiedSeats.includes(seatID)) {
                        seat.classList.add('occupied');
                    } else {
                        seat.addEventListener('click', () => toggleSeat(seat, seatID));
                    }
                    rowDiv.appendChild(seat);
                }
                seatMap.appendChild(rowDiv);
            });
            
            let selectedSeats = [];
            const seatsListSpan = document.getElementById('selected-seats-list');
            const totalPriceSpan = document.getElementById('total-price');
            const confirmBtn = document.getElementById('confirm-btn');

            function toggleSeat(seatElement, seatID) {
                seatElement.classList.toggle('selected');
                
                if (selectedSeats.includes(seatID)) {
                    selectedSeats = selectedSeats.filter(id => id !== seatID);
                } else {
                    selectedSeats.push(seatID);
                }
                updateCheckout();
            }
            
            function updateCheckout() {
                if (selectedSeats.length > 0) {
                    seatsListSpan.textContent = selectedSeats.join(', ');
                    totalPriceSpan.textContent = selectedSeats.length * ticketPrice;
                    confirmBtn.disabled = false;
                } else {
                    seatsListSpan.textContent = 'None';
                    totalPriceSpan.textContent = '0';
                    confirmBtn.disabled = true;
                }
            }
            
            confirmBtn.addEventListener('click', function() {
                if (selectedSeats.length === 0) {
                    alert("Please select at least one seat.");
                    return;
                }
                
                const updatedOccupiedSeats = [...occupiedSeats, ...selectedSeats];
                localStorage.setItem(showKey, JSON.stringify(updatedOccupiedSeats));
                
                const bookingReceipt = {
                    movie: movie,
                    date: date,
                    time: time,
                    seats: selectedSeats,
                    total: selectedSeats.length * ticketPrice,
                    bookingID: 'BKG-' + Math.floor(Math.random() * 1000000)
                };
                
                const bookingHistory = JSON.parse(localStorage.getItem('myBookings')) || [];
                bookingHistory.push(bookingReceipt);
                localStorage.setItem('myBookings', JSON.stringify(bookingHistory));
                
                alert(`Booking Confirmed! \nYour ID is ${bookingReceipt.bookingID}`);
                window.location.href = "user-home.html"; 
            });
        })();
    </script>
</body>
</html>
