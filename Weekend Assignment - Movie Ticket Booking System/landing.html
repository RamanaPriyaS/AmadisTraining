<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovizBook</title>
    <link rel="icon" href="Images/MovizBook.png">
    <link rel="stylesheet" href="style.css">
    <style>
        #Moviesavailable {
            display: flex;
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 40px; 
            padding: 40px;
        }
        .movies {
            display: flex;
            flex-direction: column;
            width: 300px; 
            background-color: white; 
        }
        .movies img {
            width: 100%; 
            height: 450px; 
            object-fit: cover; 
        }
        .book-btn {
            width: 100%; 
            padding: 12px 0;
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            border-top: none; 
            color: black;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }
        .book-btn:hover {
            background-color: #ddd;
        }
        .search-container {
            flex-grow: 1; 
            display: flex;
            justify-content: center; 
            max-width: 400px; 
            margin: 0 20px; 
        }

        .search-container input {
            width: 100%;
            padding: 8px 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            outline: none;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="Images/MovizBook.png" width="100px" alt="MovizBook Logo"> 
                <span>MovizBook</span>
            </div>

            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search movies...">
                <button id="search-btn"> Search</button>
            </div>
            <div class="nav-link">
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </nav>
    </header>
    
    <main>
        <div id="Moviesavailable">
            <!-- Movie 1 -->
            <div class="movies">
                <img src="Images/aladdin.avif" alt="Aladdin">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 2 -->
            <div class="movies">
                <img src="Images/bambi.avif" alt="Bambi">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 3 -->
            <div class="movies">
                <img src="Images/beauty-1532612274.avif" alt="Beauty and The Beast">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 4 -->
            <div class="movies">
                <img src="Images/cinderella.avif" alt="Cinderella">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 5 -->
            <div class="movies">
                <img src="Images/dolmantians 101.avif" alt="101 Dalmatians">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 6 -->
            <div class="movies">
                <img src="Images/frog-1532612274.avif" alt="Princess and The Frog">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 7 -->
            <div class="movies">
                <img src="Images/frozen.avif" alt="Frozen">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 8 -->
            <div class="movies">
                <img src="Images/lilo and stitch.avif" alt="Lilo and Stitch">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 9 -->
            <div class="movies">
                <img src="Images/lionking.avif" alt="The Lion King">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 10 -->
            <div class="movies">
                <img src="Images/little mermaid.avif" alt="The Little Mermaid">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 11 -->
            <div class="movies">
                <img src="Images/moana-1532612277.avif" alt="Moana">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 12 -->
            <div class="movies">
                <img src="Images/mulan-1532612648.avif" alt="Mulan">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 13 -->
            <div class="movies">
                <img src="Images/peter pan.avif" alt="Peter Pan">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 14 -->
            <div class="movies">
                <img src="Images/rescuers-1532612648.avif" alt="Rescuers Down Under">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 15 -->
            <div class="movies">
                <img src="Images/robin-hood-1532612648.avif" alt="Robin Hood">
                <button class="book-btn">Book Now</button>
            </div>
            <!-- Movie 16 -->
            <div class="movies">
                <img src="Images/toast-1532612648.avif" alt="The Brave Little Toaster">
                <button class="book-btn">Book Now</button>
            </div>
        </div>
    </main>
    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const movieCards = document.querySelectorAll('.movies');
        
        function filterMovies() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            movieCards.forEach(card => {
                const title = card.querySelector('img').getAttribute('alt').toLowerCase();
                if (title.includes(searchTerm)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
        
        if (searchBtn && searchInput) {
            searchBtn.addEventListener('click', filterMovies);
            searchInput.addEventListener('input', filterMovies);
        }

        const bookButtons = document.querySelectorAll('.book-btn');
        bookButtons.forEach(button => {
            button.addEventListener('click', function() {
                const movieTitle = this.parentElement.querySelector('img').getAttribute('alt');
                localStorage.setItem('selectedMovie', movieTitle);
                
               
                const userChoice = confirm("You must be logged in to book a ticket.\n\nClick 'OK' to Login, or click 'Cancel' to Sign Up.");
                
                if (userChoice) {
                    window.location.href = "login.html"; 
                } else {
                    window.location.href = "signup.html"; 
                }
            });
        });
    </script>
</body>
</html>
